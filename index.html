<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Conversor MTS - DLCCS</title>
    <meta
      name="description"
      content="Converta os vídeos .MTS da filmadora em MP4, com melhoria de imagem opcional. Tudo acontece no seu navegador: nenhum vídeo sai do seu computador."
    />
    <meta name="theme-color" content="#eaedf1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11151b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/icons/camcorder.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <a class="skip" href="#main">Pular para o conteúdo</a>
    <div id="app">
      <header class="site-header shell">
        <a class="wordmark" href="/" aria-label="Conversor MTS - DLCCS, página inicial">
          <svg class="wordmark__mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#0E1218" />
            <rect x="5" y="10" width="15" height="12" rx="3" fill="none" stroke="#DDE6F2" stroke-width="1.9" />
            <path d="m20 14.2 6-3.4v10.4l-6-3.4" fill="none" stroke="#DDE6F2" stroke-width="1.9" stroke-linejoin="round" />
            <circle cx="10" cy="16" r="1.9" fill="#FF4B3E" />
          </svg>
          <span class="wordmark__name">Conversor MTS</span>
          <span class="wordmark__brand">DLCCS</span>
        </a>
      </header>
      <div id="notices" class="shell notices"></div>
      <main id="main" class="page shell" tabindex="-1">
        <div id="intro" class="intro">
          <h1 class="intro__title">Transforme os vídeos da filmadora em MP4</h1>
          <p class="lead">
            Converte os arquivos .MTS do cartão e, se quiser, melhora a imagem. Tudo acontece aqui no seu computador.
          </p>
        </div>
        <h1 id="state-title" class="sr-only"></h1>
      </main>
      <footer class="site-footer">
        <div class="shell site-footer__inner">
          <p class="site-footer__privacy">
            <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
            Seus vídeos não saem do seu computador. Tudo é convertido aqui no navegador.
          </p>
          <div id="log-slot"></div>
          <p class="site-footer__brand">Conversor MTS - DLCCS</p>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
